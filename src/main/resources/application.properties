spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none

# Fix N+1 queries by batch fetching collections
spring.jpa.properties.hibernate.default_batch_fetch_size=100

jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=30

# Swagger / OpenAPI configuration
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.enable-hateoas=false

# Logging Configuration
logging.file.name=logs/backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
