#------
spring.datasource.url=jdbc:h2:file:./data/testdb
#spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#Enables h2 console with its path being /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Auto creates db tables
#spring.jpa.hibernate.ddl-auto=create
#Preserves existing tables and their data between backend restarts
spring.jpa.hibernate.ddl-auto=update

#Spring security credentials
#spring.security.user.name=admin
#spring.security.user.password=admin123

# JWT — change the secret in production via environment variable
jwt.secret=change-me-in-production-must-be-at-least-32-chars
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=30

# Swagger / OpenAPI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.enable-data-rest=false
springdoc.enable-hateoas=false